# Desglossament de Cartera i Simulador de Berkshire Hathaway ($BRK.B)

Anàlisi detallada de la posició financera, estructura de negoci i cartera d'inversions del conglomerat liderat per Warren Buffett.

---

## 1. Visió General del Conglomerat ($BRK.B)

Berkshire Hathaway opera com un dels conglomerats més diversificats i resilients del món, dividit en tres grans blocs d'actius:

1. **Negocis Operatius Privats**: Assegurances (GEICO, Berkshire Hathaway Reinsurance), transport ferroviari (BNSF Railway), energia i serveis públics (BHE), així com desenes d'empreses industrials i de consum (Precision Castparts, Lubrizol, Marmon, McLane).
2. **Tresoreria Líquida i T-Bills**: Posició rècord de tresoreria invertida en Lletres del Tresor dels EUA (Treasury Bills) a curt termini, generant rendiments estables lliures de risc creditici.
3. **Cartera d'Inversions en Renda Variable**: Posicions concentrades en líders mundials amb avantatges competitius d'alta durabilitat (*moats*).

---

## 2. Principals Posicions Cotitzades

La cartera cotitzada pública de Berkshire Hathaway representa aproximadament el 40-45% del valor comptable del conglomerat, destacant les següents participacions estratègiques:

| Empresa | Ticker | Sector | Pes Estimador (%) | Tesi d'Inversió |
| :--- | :---: | :--- | :---: | :--- |
| **Apple Inc.** | $AAPL | Tecnologia / Ecosistema | ~28.5% | Fidelització d'usuaris, fort flux de caixa lliure i recompras agressives. |
| **American Express** | $AXP | Serveis Financers | ~15.2% | Xarxa tancada de pagaments, clients premium i poder de fixació de preus. |
| **Bank of America** | $BAC | Banca Comercial | ~11.8% | Escala en dipòsits minoristes nord-americans i eficiència operativa. |
| **The Coca-Cola Company** | $KO | Béns de Consum | ~9.6% | Marca global inigualable, distribució massiva i flux de dividends sostingut. |
| **Chevron Corp.** | $CVX | Energia Integrada | ~6.4% | Producció d'hidrocarburs de baix cost i retorn de capital disciplinat. |
| **Occidental Petroleum** | $OXY | Exploració i Producció | ~5.1% | Actius estratègics a la conca Permian i drets d'adquisició preferents. |
| **Mitsubishi Corp.** | $8058 | Sogo Shosha / Comerç | ~2.9% | Diversificació en recursos naturals, béns industrials i alimentació al Japó. |
| **Mitsui & Co.** | $8031 | Sogo Shosha / Comerç | ~2.7% | Posició líder en minerals de ferro, gas natural i logística global. |
| **Itochu Corp.** | $8001 | Sogo Shosha / Comerç | ~2.5% | Enfocament en sectors no vinculats a recursos com consum, tèxtil i distribució. |
| **Sumitomo Corp.** | $8053 | Sogo Shosha / Comerç | ~2.1% | Metalls, maquinària i infraestructures energètiques sostenibles. |
| **Marubeni Corp.** | $8002 | Sogo Shosha / Comerç | ~1.9% | Comerç de gra, agroquímics i generació d'energia elèctrica. |

---

## 3. Simulador de Valor Intrínsec per Acció

Per estimar el valor intrínsec d'una acció de Berkshire Hathaway Classe B ($BRK.B), es calcula la suma de les parts (*Sum of the Parts* - SOTP):

1. **Efectiu i Equivalents per Acció**: Tresoreria neta disponible per a noves inversions o recompras.
2. **Cartera d'Accions per Acció**: Valor de mercat transparent segons les cotitzacions en borsa.
3. **Múltiple Operatiu dels Negocis Privats**: BNSF, GEICO i BHE valorats a un múltiple moderat de beneficis operatius nets (12x - 15x EBIT).

El diferencial històric entre el valor comptable i el preu de cotització ha ofert històricament un marge de seguretat protector per als inversors a llarg termini.
