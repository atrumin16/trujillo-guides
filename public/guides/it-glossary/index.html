<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glosario Informático - Aprende Jugando</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/style.css">
    </head>
<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 min-h-screen transition-colors duration-300">

    <!-- Modal de Selección de Usuario -->
    <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] modal-overlay">
        <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 max-w-2xl w-full mx-4">
            <h2 class="text-3xl font-extrabold text-center mb-6 text-gray-800 dark:text-white" data-i18n="selectLevel">
                ¿Qué tipo de usuario eres?
            </h2>
            <p class="text-center text-gray-600 dark:text-gray-300 mb-8" data-i18n="selectLevelDesc">
                Elige tu nivel para adaptar las explicaciones
            </p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button data-level="basic" class="p-6 bg-gradient-to-br from-green-400 to-green-600 text-white rounded-2xl hover:scale-105 transition-transform shadow-lg">
                    <div class="text-5xl mb-3">🌱</div>
                    <h3 class="text-xl font-bold mb-2" data-i18n="basic">Básico</h3>
                    <p class="text-sm" data-i18n="basicDesc">Nunca he usado un ordenador</p>
                </button>
                <button data-level="intermediate" class="p-6 bg-gradient-to-br from-blue-400 to-blue-600 text-white rounded-2xl hover:scale-105 transition-transform shadow-lg">
                    <div class="text-5xl mb-3">💻</div>
                    <h3 class="text-xl font-bold mb-2" data-i18n="intermediate">Intermedio</h3>
                    <p class="text-sm" data-i18n="intermediateDesc">Entiendo algo de informática</p>
                </button>
                <button data-level="advanced" class="p-6 bg-gradient-to-br from-purple-400 to-purple-600 text-white rounded-2xl hover:scale-105 transition-transform shadow-lg">
                    <div class="text-5xl mb-3">🚀</div>
                    <h3 class="text-xl font-bold mb-2" data-i18n="advanced">Avanzado</h3>
                    <p class="text-sm" data-i18n="advancedDesc">Tengo conocimientos técnicos</p>
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-50 transition-colors duration-300">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <h1 class="text-2xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
                    🎓 <span data-i18n="title">Glosario Informático</span>
                </h1>
                
                <div class="flex flex-wrap gap-3 items-center">
                    <!-- Link volver a Guides -->
                    <a href="/" class="px-3.5 py-1.5 rounded-full border border-purple-300 dark:border-purple-600 bg-white/90 dark:bg-gray-700 text-xs font-semibold text-purple-700 dark:text-purple-300 hover:bg-purple-50 dark:hover:bg-gray-600 transition shadow-sm flex items-center gap-1">
                        ← <span>Guides Hub</span>
                    </a>

                    <!-- Selector de idioma -->
                    <select id="languageSelect" onchange="changeLanguage(this.value)" class="px-4 py-2 rounded-full border-2 border-purple-200 dark:border-purple-700 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:border-purple-500 focus:outline-none">
                        <option value="es">🇪🇸 Español</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="ca">🏴 Català</option>
                    </select>
                    
                    <!-- Toggle modo oscuro -->
                    <button id="darkModeToggleBind" id="darkModeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                        <span id="darkModeIcon">🌙</span>
                    </button>
                    
                    <!-- Cambiar nivel -->
                    <button data-action="show-user-modal" class="px-4 py-2 bg-green-500 text-white rounded-full font-bold hover:bg-green-600 transition shadow-md">
                        👤 <span data-i18n="changeLevel">Cambiar Nivel</span>
                    </button>
                </div>
            </div>
            
            <!-- Buscador -->
            <div class="mt-4 flex justify-center">
                <div class="relative w-full max-w-md">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar término..." data-i18n-placeholder="searchPlaceholder"
                           class="w-full px-6 py-3 rounded-full border-2 border-purple-200 dark:border-purple-700 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:border-purple-500 focus:outline-none text-lg shadow-sm">
                </div>
            </div>
            
            <!-- Controles -->
            <div class="flex justify-center gap-4 mt-4 flex-wrap">
                <button data-view="grid" id="btnGrid" class="px-6 py-2 bg-blue-500 text-white rounded-full font-bold hover:bg-blue-600 transition shadow-md">
                    📋 <span data-i18n="viewAll">Ver Todo</span>
                </button>
                <button data-view="quiz" id="btnQuiz" class="px-6 py-2 bg-gray-300 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-full font-bold hover:bg-purple-600 hover:text-white transition shadow-md">
                    🎮 <span data-i18n="quizMode">Modo Quiz</span>
                </button>
                <button data-action="shuffle" class="px-6 py-2 bg-pink-500 text-white rounded-full font-bold hover:bg-pink-600 transition shadow-md">
                    🔄 <span data-i18n="shuffle">Mezclar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- Vista Grid -->
        <div id="gridView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Las tarjetas se generan con JavaScript -->
        </div>

        <!-- Vista Quiz -->
        <div id="quizView" class="hidden max-w-2xl mx-auto">
            <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 text-center transition-colors duration-300">
                <div id="quizContainer">
                    <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-200 mb-6" data-i18n="whatMeans">¿Qué significa este término?</h2>
                    <div id="questionCard" class="mb-8"></div>
                    <div id="answersGrid" class="grid grid-cols-1 gap-4"></div>
                    <div id="quizResult" class="mt-6 hidden"></div>
                </div>
                <div id="quizScore" class="hidden mt-6 p-4 bg-yellow-100 dark:bg-yellow-900 rounded-xl">
                    <p class="text-xl font-bold text-yellow-800 dark:text-yellow-200">
                        <span data-i18n="score">Puntuación</span>: <span id="scoreValue">0</span>/10
                    </p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 mt-12 py-6 text-center text-gray-600 dark:text-gray-300 transition-colors duration-300">
        <p class="font-semibold" data-i18n="footer">✨ Aprende informática de forma fácil y divertida ✨</p>
    </footer>

    
  <script src="/js/guides.js"></script>
  <script src="/js/glossary.js"></script>
</body>
</html>
