<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glosario de sistemas · ATM Docs</title>
  <meta name="description" content="Glosario interactivo de hardware, software y redes. Niveles, búsqueda y quiz.">
  <link rel="icon" type="image/png" href="/avatar.png">
  <meta name="theme-color" content="#080c14">
  <script src="/js/theme-boot.js?v=gloss2"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=gloss2">
  <link rel="stylesheet" href="/style.css?v=c5">
</head>
<body class="docs-body glossary-page">
  <div id="userModal" class="glossary-modal hidden">
    <div class="glossary-modal-card">
      <h2 data-i18n="selectLevel">Nivel de lectura</h2>
      <p data-i18n="selectLevelDesc">Adapta las definiciones a tu nivel.</p>
      <div class="glossary-level-row">
        <button type="button" data-level="basic">
          <strong data-i18n="basic">Básico</strong>
          <span data-i18n="basicDesc">Conceptos de partida</span>
        </button>
        <button type="button" data-level="intermediate">
          <strong data-i18n="intermediate">Intermedio</strong>
          <span data-i18n="intermediateDesc">Uso habitual de sistemas</span>
        </button>
        <button type="button" data-level="advanced">
          <strong data-i18n="advanced">Avanzado</strong>
          <span data-i18n="advancedDesc">Detalle técnico</span>
        </button>
      </div>
    </div>
  </div>

  <div class="guide-container glossary-shell">
    <p class="hero-badge">Interactivo · Sistemas</p>
    <h1 class="page-title" data-i18n="title">Glosario de sistemas</h1>
    <p class="page-subtitle">Términos de hardware, software y redes. Pulsa una tarjeta para leer la definición.</p>

    <div class="glossary-toolbar">
      <input type="search" id="searchInput" placeholder="Buscar término…" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
      <select id="languageSelect" aria-label="Idioma">
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="ca">CA</option>
      </select>
      <button type="button" data-action="show-user-modal"><span data-i18n="changeLevel">Nivel</span></button>
      <button type="button" data-view="grid" id="btnGrid" class="is-active"><span data-i18n="viewAll">Términos</span></button>
      <button type="button" data-view="quiz" id="btnQuiz"><span data-i18n="quizMode">Quiz</span></button>
      <button type="button" data-action="shuffle"><span data-i18n="shuffle">Mezclar</span></button>
    </div>

    <div id="gridView" class="glossary-grid"></div>

    <div id="quizView" class="glossary-quiz hidden">
      <p class="quiz-prompt" data-i18n="whatMeans">¿Qué significa este término?</p>
      <div id="questionCard" class="quiz-term"></div>
      <div id="answersGrid" class="quiz-answers"></div>
      <div id="quizResult" class="hidden"></div>
      <p id="quizScore" class="quiz-score hidden"><span data-i18n="score">Puntuación</span>: <span id="scoreValue">0</span></p>
    </div>
  </div>

  <script src="/js/guides.js?v=c5"></script>
  <script src="/js/glossary.js?v=gloss2"></script>
</body>
</html>
