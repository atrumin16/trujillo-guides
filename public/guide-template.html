<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · ATM Docs</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#080c14">
  <script src="/js/theme-boot.js?v=c6"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=c6">
  <link rel="stylesheet" href="/style.css?v=c6">
  <link rel="stylesheet" href="/css/community.css?v=c6">
</head>
<body class="docs-body community-body">
  <header class="docs-topbar">
    <a href="/" class="brand">
      <img src="/avatar.png" alt="" class="brand-avatar" width="28" height="28">
      <span>ATM Docs</span>
    </a>
    <div class="topbar-actions">
      <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Cambiar tema" aria-label="Cambiar tema">Tema</button>
      <a class="hub-link" href="https://ai.trujillomingorance.com" rel="noopener">Studio</a>
    </div>
  </header>

  <div class="guide-container">
    <a href="/" class="back-nav">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al Hub de Guías
    </a>

    <h1 class="page-title">{{TITLE}}</h1>
    <div id="guide-meta-bar" class="meta-bar border-b border-neutral-800 pb-4 mb-8">
      <img class="by-logo" src="/avatar.png" alt="" width="28" height="28">
      <p class="meta-line"><strong>Alberto Trujillo Mingorance</strong> · @atrumin16 · <span class="guide-badge">Guides</span> · {{DATE}}</p>
      <button type="button" class="copy-link" id="copy-link"><span>Copiar enlace</span></button>
    </div>

    <p class="page-subtitle">{{DESCRIPTION}}</p>
    <article id="guide-body" class="md-body doc"></article>
    <aside id="guide-attachments" class="attach-list" hidden></aside>
  </div>

  <script type="text/markdown" id="guide-markdown">{{CONTENT}}</script>
  <script type="application/json" id="guide-payload">{"attachments":[],"widgets":[],"date":"{{DATE}}"}</script>
  <script src="/js/marked.min.js"></script>
  <script src="/js/guides.js?v=c6"></script>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle-btn');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('trujillo_theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
