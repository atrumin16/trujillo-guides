<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · Trujillo Guides</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#080c14">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('trujillo_theme');
        var theme = savedTheme || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css?v=20260906-resp5">
  <style>
    .guide-container { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
    .back-nav { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 24px; transition: color 0.15s; }
    .back-nav:hover { color: var(--text-primary); }
    .hero-badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #10b981; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); padding: 4px 10px; border-radius: 9999px; margin-bottom: 14px; }
    .page-title { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-primary); margin-bottom: 12px; line-height: 1.2; }
    .page-subtitle { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 32px; }
    .step-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 28px; transition: border-color 0.2s; }
    .step-card:hover { border-color: var(--border-focus); }
    .step-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--text-primary); color: var(--bg); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .step-title { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
    .settings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .settings-table th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    .settings-table td { padding: 12px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); }
    .settings-table tr:last-child td { border-bottom: none; }
    .field-name { font-weight: 600; color: var(--text-primary); }
    .field-note { font-size: 12px; color: var(--text-muted); }
    @media (max-width: 480px) {
      .guide-container { padding: 20px 14px 60px; }
      .page-title { font-size: 24px; }
      .step-card { padding: 16px 14px; }
      .settings-table th, .settings-table td { padding: 8px 6px; font-size: 12px; }
      .field-val { font-size: 11px; word-break: break-all; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="header-left">
      <img src="/avatar.png" alt="Trujillo AI" class="header-logo">
      <span class="brand-title">TRUJILLO AI</span>
      <span class="brand-badge">Guides Hub</span>
    </a>
    <div class="header-right">
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Cambiar tema">
        <svg class="sun-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="guide-container">
    <a href="/" class="back-nav">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al Hub de Guías
    </a>

    <span class="hero-badge">● Configuración Verificada</span>
    <h1 class="page-title">{{TITLE}}</h1>
    <p class="page-subtitle">{{DESCRIPTION}}</p>

    <!-- STEP 1 -->
    <section class="step-card">
      <div class="step-header">
        <span class="step-num">1</span>
        <h2 class="step-title">Paso 1: Configuración Principal</h2>
      </div>
      <table class="settings-table">
        <thead>
          <tr>
            <th>Parámetro</th>
            <th>Valor</th>
            <th>Notas</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="field-name">Ejemplo</td>
            <td><span class="field-val">Valor</span></td>
            <td class="field-note">Descripción</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <script>
    const themeBtn = document.getElementById('theme-toggle-btn');
    themeBtn?.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('trujillo_theme', next);
    });
  </script>
</body>
</html>
